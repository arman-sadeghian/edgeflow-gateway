server:
  port: 12336

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:12335
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        - id: payment-service
          uri: http://localhost:12337
          predicates:
            - Path=/api/payments,/api/payments/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info