server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:18085}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:18084/realms/edgeflow}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18084/realms/edgeflow/protocol/openid-connect/certs}

  cloud:
    discovery:
      client:
        simple:
          instances:
            user-service:
              - uri: ${USER_SERVICE_1_URL:http://localhost:18081}
              - uri: ${USER_SERVICE_2_URL:http://localhost:18083}

    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 2
                redis-rate-limiter.requestedTokens: 1
            - AddResponseHeader=X-EdgeFlow-Gateway, EdgeFlow

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:18082}
          predicates:
            - Path=/api/payments,/api/payments/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}